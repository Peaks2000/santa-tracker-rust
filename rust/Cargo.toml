[package]
name = "santa-tracker"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native Rust port of Santa Tracker (in development)"

[dependencies]
macroquad = { version = "0.4.14", default-features = false }
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "raster-images"] }
lewton = "0.10"
png = "0.17"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thorvg = "0.5.1"

[profile.release]
lto = true
strip = true
codegen-units = 1
